name: Mantener Supabase activo

# Mientras el proyecto esté en el plan gratuito, Supabase lo pausa tras 7 días de poca actividad.
# Este chequeo hace una consulta real a la base lunes y jueves. Si falla (proyecto pausado, clave mal cargada),
# GitHub marca la ejecución en rojo y avisa por mail: sirve también como alarma.
# SOLO ES UN PARCHE PARA EL DESARROLLO: en producción corresponde un plan pago, que no se pausa.

on:
  schedule:
    - cron: "0 12 * * 1,4"   # lunes y jueves, 12:00 UTC (9:00 en Argentina)
  workflow_dispatch:          # permite correrlo a mano desde la pestaña Actions

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Consultar la base de datos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Faltan los secrets SUPABASE_URL y SUPABASE_PUBLISHABLE_KEY (Settings > Secrets and variables > Actions)."; exit 1
          fi
          curl --fail --silent --show-error --max-time 30 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -o /dev/null -w "Supabase respondió: HTTP %{http_code}\n" \
            "${SUPABASE_URL%/}/rest/v1/courses?select=slug&limit=1"
